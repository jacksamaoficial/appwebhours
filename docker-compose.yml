services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-appwebhours}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appwebhours}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-appwebhours}
      SECRET_KEY: ${SECRET_KEY:-changeme-use-openssl-rand-hex-32-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ALLOWED_ORIGINS: http://localhost:5173
      ENVIRONMENT: development
      BACKUP_DIR: /backups
      # Emails that can open the admin panel (backup / restore), comma-separated
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - ${BACKUP_HOST_DIR:-./backups}:/backups

  # Daily database backup (cron). Files land in ./backups on the host.
  backup:
    build: ./deploy/backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-appwebhours}
      TZ: ${TZ:-Europe/Madrid}
      BACKUP_CRON: ${BACKUP_CRON:-0 6 * * *}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # Optional off-site copy with rclone, e.g. gdrive:jacksocialclub-backups
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ./deploy/backup/rclone:/config/rclone

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8001/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8001/api/v1
    ports:
      - "5173:80"

volumes:
  postgres_data:
