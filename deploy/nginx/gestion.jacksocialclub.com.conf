# Host nginx site for the app. Install:
#   cp deploy/nginx/gestion.jacksocialclub.com.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/gestion.jacksocialclub.com.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d gestion.jacksocialclub.com   # adds HTTPS + redirect
server {
    listen 80;
    listen [::]:80;
    server_name gestion.jacksocialclub.com;

    # Backups can be uploaded from the admin panel
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8210;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append): a client-sent X-Forwarded-For must not reach the
        # API, or it could fake its IP and dodge the login rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # restoring a backup can take a while
    }
}
